name: News for HomeBlocks

# Every few hours, fetch recent headlines from Wikipedia's Current Events portal (CC BY-SA 4.0) into news.json,
# which the HomeBlocks news desks read at run time. Only lighter categories make it in; see tools/news.py.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines
        run: python3 tools/news.py 21
      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then echo "No new headlines."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "News: $(python3 -c "import json;print(len(json.load(open('news.json'))['items']))") headlines"
          for k in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
