name: Build screen savers

# Builds the macOS .saver and the Windows .scr from the same index.html, then publishes both
# to the rolling "latest" release.
#
# Signing switches on by itself once the secrets exist (see SIGNING.md):
#   macOS   MACOS_CERT_P12, MACOS_CERT_PASSWORD, NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID
# Without them, the Mac build is unsigned (as before). The Windows build is free and unsigned.

on:
  push:
    branches: [main]
    paths: ["index.html", "saver/**", "windows/**", ".github/workflows/screensaver.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    env:
      MAC_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    outputs:
      signed: ${{ steps.flag.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - id: flag
        run: echo "signed=$MAC_SIGNING" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: saver
        run: xcodegen generate

      - name: Build universal .saver
        working-directory: saver
        run: |
          xcodebuild -project BigAppleSam.xcodeproj -target BigAppleSam -configuration Release \
            SYMROOT="$PWD/build" ONLY_ACTIVE_ARCH=NO build | tail -n 40
          ls -la "build/Release"
          lipo -info "build/Release/Big Apple Sam.saver/Contents/MacOS/Big Apple Sam"
          test -f "build/Release/Big Apple Sam.saver/Contents/Resources/index.html"

      - name: Test that the .saver draws the city
        working-directory: saver
        run: |
          swiftc -O Tests/saver_test.swift -framework ScreenSaver -o "$RUNNER_TEMP/saver_test"
          mkdir -p "$RUNNER_TEMP/shots"
          for m in direct snapshot; do
            BAS_RENDER=$m "$RUNNER_TEMP/saver_test" "build/Release/Big Apple Sam.saver" "$RUNNER_TEMP/shots/$(sw_vers -productVersion)-$m.png" 12 \
              || echo "::warning::$m rendering drew nothing on macOS $(sw_vers -productVersion)"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saver-test-${{ github.job }}
          path: ${{ runner.temp }}/shots

      - name: Import Developer ID certificate
        if: env.MAC_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$ID" ]; then echo "::error::No 'Developer ID Application' identity in MACOS_CERT_P12"; exit 1; fi
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Sign, notarize and staple the .saver
        if: env.MAC_SIGNING == 'true'
        working-directory: saver/build/Release
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          notarize() {
            xcrun notarytool submit "$1" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
            cat "$RUNNER_TEMP/notary.json"; echo
            if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != "Accepted" ]; then
              SUB=$(jq -r .id "$RUNNER_TEMP/notary.json")
              [ -n "$SUB" ] && [ "$SUB" != "null" ] && xcrun notarytool log "$SUB" --key "$RUNNER_TEMP/notary.p8" \
                --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
              echo "::error::Notarization of $1 failed"; exit 1
            fi
          }
          codesign --force --timestamp --options runtime --keychain "$KC" --sign "$SIGN_ID" "Big Apple Sam.saver"
          codesign --verify --strict --verbose=2 "Big Apple Sam.saver"
          ditto -c -k --keepParent "Big Apple Sam.saver" "$RUNNER_TEMP/saver.zip"
          notarize "$RUNNER_TEMP/saver.zip"
          for k in 1 2 3 4; do xcrun stapler staple "Big Apple Sam.saver" && break; [ $k = 4 ] && exit 1; echo "Stapling failed, retrying in 20s"; sleep 20; done
          for k in 1 2 3 4; do xcrun stapler validate "Big Apple Sam.saver" && break; [ $k = 4 ] && exit 1; sleep 20; done

      - name: Package (.dmg and .zip)
        run: |
          mkdir -p dmg && cp -R "saver/build/Release/Big Apple Sam.saver" dmg/
          hdiutil create -volname "Big Apple Sam" -srcfolder dmg -ov -format UDZO Big-Apple-Sam-Mac.dmg
          ditto -c -k --sequesterRsrc --keepParent "saver/build/Release/Big Apple Sam.saver" Big-Apple-Sam-saver.zip

      - name: Sign, notarize and staple the .dmg
        if: env.MAC_SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          codesign --force --timestamp --keychain "$KC" --sign "$SIGN_ID" Big-Apple-Sam-Mac.dmg
          xcrun notarytool submit Big-Apple-Sam-Mac.dmg --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          for k in 1 2 3 4; do xcrun stapler staple Big-Apple-Sam-Mac.dmg && break; [ $k = 4 ] && exit 1; echo "Stapling failed, retrying in 20s"; sleep 20; done
          spctl -a -vvv -t open --context context:primary-signature Big-Apple-Sam-Mac.dmg

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            Big-Apple-Sam-Mac.dmg
            Big-Apple-Sam-saver.zip

  mac-newest:
    # Builds and runs the same test on the newest macOS runner GitHub has (macOS 26 is where web views in
    # screen savers started going blank). Informational only: it never blocks a release.
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: saver
        run: |
          sw_vers
          brew install xcodegen && xcodegen generate
          xcodebuild -project BigAppleSam.xcodeproj -target BigAppleSam -configuration Release SYMROOT="$PWD/build" build | tail -n 5
          swiftc -O Tests/saver_test.swift -framework ScreenSaver -o "$RUNNER_TEMP/saver_test"
          mkdir -p "$RUNNER_TEMP/shots"
          for m in default direct snapshot; do
            if [ $m = default ]; then unset BAS_RENDER; else export BAS_RENDER=$m; fi
            "$RUNNER_TEMP/saver_test" "build/Release/Big Apple Sam.saver" "$RUNNER_TEMP/shots/$(sw_vers -productVersion)-$m.png" 12 \
              || echo "::warning::$m rendering drew nothing on macOS $(sw_vers -productVersion)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saver-test-mac-newest
          path: ${{ runner.temp }}/shots

  windows:
    runs-on: windows-2022
    env:
      BAS_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch WebView2 SDK
        working-directory: windows
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory packages -NonInteractive

      - name: Build BigAppleSam.scr
        working-directory: windows
        run: .\build.ps1 -Version $env:BAS_VERSION

      - name: Smoke test (run it and take screenshots)
        working-directory: windows
        run: .\smoke.ps1

      - name: Build installer
        working-directory: windows
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q "/DAppVersion=$env:BAS_VERSION" installer.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }

      - name: Zip the bare .scr
        working-directory: windows
        run: Compress-Archive -Path BigAppleSam.scr -DestinationPath Big-Apple-Sam-Windows-scr.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows/Big-Apple-Sam-Windows-Setup.exe
            windows/Big-Apple-Sam-Windows-scr.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: windows/shots/

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out

      - name: Publish rolling "latest" release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ needs.mac.outputs.signed }}
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ "$MAC_SIGNED" = "true" ]; then
            MAC="**Mac:** open Big-Apple-Sam-Mac.dmg and double-click Big Apple Sam.saver (signed and notarized by Apple)."
          else
            MAC="**Mac:** unzip Big-Apple-Sam-saver.zip and double-click Big Apple Sam.saver. This build is not notarized yet, so see the README for the one-time security step."
          fi
          WIN="**Windows 10/11:** run Big-Apple-Sam-Windows-Setup.exe. It isn't code-signed, so Windows may say \"Windows protected your PC\": choose More info, then Run anyway."

          NOTES=$(printf 'Built from %s.\n\n%s\n\n%s\n\nSHA-256 checksums are in SHA256SUMS.txt.' "${GITHUB_SHA::7}" "$MAC" "$WIN")
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest * --repo "$GITHUB_REPOSITORY" \
            --title "Big Apple Sam screen savers (latest build)" --notes "$NOTES" --target "$GITHUB_SHA"
