<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeBlocks</title>
<meta name="description" content="Free homesteads for every block in the city: the homepages of everyone living in Big Apple Sam.">
<style>
html,body{margin:0;height:100%;background:#808080;font:13px Arial,sans-serif}
#f{position:fixed;left:0;right:0;bottom:0;top:36px;width:100%;height:calc(100% - 36px);border:0;background:#fff}
/* a slim, present-day bar above the 1998 web: where this person lives in Big Apple Sam */
#bas{position:fixed;top:0;left:0;right:0;height:36px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;box-sizing:border-box;
  background:#14161c;color:#c9ced8;font:500 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-bottom:1px solid #262a33;z-index:2}
#bas .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;opacity:.8}
#bas .lbl b{color:#fff;font-weight:600}
#bas a{flex:none;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:13px;background:#f5c542;color:#14161c;text-decoration:none;font-weight:600;white-space:nowrap}
#bas a:hover{background:#ffd75e}
#bas a:focus-visible{outline:2px solid #fff;outline-offset:2px}
#bas[hidden]{display:none}
@media (max-width:520px){#bas .lbl{display:none}#bas{justify-content:flex-end}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.box{width:min(420px,90vw);background:#c0c0c0;border:2px outset #fff}
.box .t{background:#000080;color:#fff;font-weight:bold;padding:3px 6px}
.box .b{padding:14px 16px}
.bar{height:14px;border:2px inset #fff;background:#fff;margin-top:10px}
.bar span{display:block;height:100%;width:0;background:#000080;transition:width .3s}
.trail{position:absolute;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<div id="load"><div class="box"><div class="t">NetSurfer</div><div class="b"><div id="msg">Contacting host: www.homeblocks.com...</div><div class="bar"><span id="prog"></span></div></div></div></div>
<div id="bas" hidden><span class="lbl" id="basLbl"></span><a id="basGo" href="../">Open the city</a></div>
<iframe id="f" title="HomeBlocks" hidden></iframe>
<script>
'use strict';
/* HomeBlocks on its own: loads the Big Apple Sam engine from the app's page, rebuilds the city named in the
   address (or the one saved in this browser), and shows its homepages full-window. Addresses look like
   #<city code>/<Neighborhood>/<Suburb>/<number>/<page>, so Back/Forward, bookmarks and shared links work.
   A shared link can pin the day in the city (#<code>~<day>/...): it then opens that city on that day, so the
   friend sees the page as the sender did, and it leaves this browser's own saved city alone. */
const W$={code:null,pin:null,sim0:0,t0:0,cur:null,doc:null,imgs:[]};
const $=id=>document.getElementById(id);
function step(t,p){$('msg').textContent=t;$('prog').style.width=p+'%'}
function toHash(url){const m=String(url).match(/^https?:\/\/(?:www\.)?homeblocks\.com(\/[^#]*)?/i);return'#'+W$.code+(W$.pin!=null?'~'+W$.pin:'')+(m?(m[1]||'/'):'!'+url)}
function fromHash(){const h=decodeURIComponent(location.hash.slice(1)),i=h.search(/[\/!]/);const rest=i<0?'/':h.slice(i);
  return rest[0]==='!'?rest.slice(1):'http://www.homeblocks.com'+rest}
function liveSim(){return W$.sim0+(Date.now()-W$.t0)/60000}
function bar(res){const s=res&&res.s,a=$('basGo'),l=$('basLbl'),city='../#city-'+W$.code;$('bas').hidden=false;
  if(s&&s.u&&s.p){const who=s.p.first,apt=`Apt ${s.u.f+2}${s.u.letter||''}`,bld=s.u.b&&s.u.b.name?s.u.b.name:'';
    l.innerHTML=`<b>${hbE(who)}</b> lives in ${hbE(apt)}${bld?', '+hbE(bld):''}, in Big Apple Sam.`;a.href=city+'/apt-'+s.u.id;a.textContent=`See ${who}'s apartment \u2192`}
  else{l.innerHTML='These homepages belong to the people of <b>Big Apple Sam</b>.';a.href=city;a.textContent='Open the city \u2192'}}
function show(url,push){
  simMin=liveSim();hbMidiStop();
  let res;try{res=hbRoute(url)}catch(e){console.error(e);res=hbErr('Error','Something went wrong loading this page.')}
  W$.cur={url,res};W$.doc=null;$('f').srcdoc=res.html;document.title=res.title;bar(res);
  const h=toHash(url);if(push)history.pushState(null,'',h);else if(location.hash!==h)history.replaceState(null,'',h);
  if(res.s&&res.file==='index.html'){const g=hbGbLoad(),k=city.seed+':'+res.s.id+':v';g[k]=(g[k]||0)+1;hbGbSave(g)}
}
function go(href){
  if(/^midi:/.test(href))return;
  if(/^https?:\/\/samuelling\.github\.io\/Big-Apple-Sam\//i.test(href)){location.href=href;return}
  if(/^https?:\/\/(www\.)?(megazine\.org|samuelling\.github\.io|sites\.bu\.edu|crumplab\.com|github\.com|en\.wikipedia\.org|creativecommons\.org)\//i.test(href)){window.open(href.replace(/^http:/,'https:'),'_blank','noopener');return}
  show(/^[a-z]+:/i.test(href)?href:'http://'+href.replace(/^\/+/,''),true);
}
function hook(){
  const doc=$('f').contentDocument;if(!doc||!doc.body)return;W$.doc=doc;W$.imgs=[...doc.querySelectorAll('img[data-s]')];
  doc.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a||e.defaultPrevented)return;const h=a.getAttribute('href');if(h.startsWith('#')){e.preventDefault();hbJump(doc,h);return}
    if(e.metaKey||e.ctrlKey||e.shiftKey){if(/homeblocks\.com/i.test(h)){e.preventDefault();window.open(location.pathname+toHash(h),'_blank','noopener')}return}
    e.preventDefault();if(h==='midi:play'){if(W$.cur.res.s)hbMidiPlay(W$.cur.res.s);return}if(h==='midi:stop'){hbMidiStop();return}if(h.startsWith('share:')){hbShareDo(h.slice(6),doc);return}go(h)});
  doc.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);
    if(f.dataset.send)return hbShareDo('mail',doc,fd);
    if(f.dataset.search)return go(HBROOT+'search?q='+encodeURIComponent(String(fd.get('q')||'').trim()));
    if(f.dataset.mail){$('f').srcdoc=hbDoc('Sent','<center><br><br><font face="Arial">Your message was sent.<br><br><font size="1">(Probably.)</font></font></center>');return}
    if(f.dataset.gb){const n=String(fd.get('n')||'').trim().slice(0,40),m=String(fd.get('m')||'').trim().slice(0,400),w=String(fd.get('w')||'').trim().slice(0,40);if(!n||!m)return;
      const g=hbGbLoad(),k=city.seed+':'+f.dataset.gb;(g[k]=g[k]||[]).push({n,m,w,d:F0()});if(g[k].length>30)g[k].shift();hbGbSave(g);show(W$.cur.url,false)}});
  const th=W$.cur.res.s&&W$.cur.res.s.th;
  if(th&&th.trail){const sp=hbSprite('sparkle',{c:th.link});let n=0;doc.addEventListener('mousemove',e=>{if(n>14)return;const i=doc.createElement('img');i.src=sp.fr[Math.floor(Math.random()*sp.fr.length)];
    i.className='trail';i.style.cssText=`position:absolute;pointer-events:none;transition:opacity .6s;left:${e.pageX+4}px;top:${e.pageY+6}px`;doc.body.appendChild(i);n++;
    setTimeout(()=>{i.style.opacity='0'},60);setTimeout(()=>{i.remove();n--},700)})}
}
function animate(){if(!W$.doc)return;const now=performance.now();
  for(const im of W$.imgs){const s=HBG.spr.get(im.dataset.s);if(!s||s.fr.length<2)continue;const f=Math.floor(now/s.ms)%s.fr.length;if(im._f!==f){im._f=f;im.src=s.fr[f]}}}
async function start(){
  step('Contacting host: www.homeblocks.com...',10);
  let txt;try{txt=await(await fetch('../index.html',{cache:'no-cache'})).text()}catch(e){step('NetSurfer is unable to locate the server. Try again later.',0);return}
  step('Transferring data from www.homeblocks.com...',40);await new Promise(r=>setTimeout(r,30));
  const m=txt.match(/<script>([\s\S]*?)<\/script>/);const sc=document.createElement('script');sc.textContent=m[1];document.head.appendChild(sc);
  const h=decodeURIComponent(location.hash.slice(1)),head=h.split(/[\/!]/)[0].split('~');let want=parseCode(head[0]);const st=loadState();
  W$.pin=want&&/^\d{1,6}$/.test(head[1]||'')&&+head[1]>=want.born?+head[1]:null;
  if(!want)want=st?{seed:st.seed,born:st.born}:{seed:(Math.random()*2e9)|0,born:Math.floor(localNow()/1440)};
  const mine=st&&st.seed===want.seed&&st.born===want.born;
  W$.sim0=W$.pin!=null?W$.pin*1440+13*60:mine?st.sim+(st.paused?0:(Date.now()-st.at)/60000):localNow();W$.t0=Date.now();simMin=W$.sim0;
  step('Building the city...',60);await new Promise(r=>setTimeout(r,30));
  city=genCity(want.seed,want.born);markParlors(city);addFrontage(city);pickKevin(city);addMega(city);samFamily(city);labFolks(city);
  const L=Math.floor(simMin/1440);for(const u of city.units)if(u.eras&&!u.mega)syncEra(u,L);refreshAges(L);kevinCheck();
  if(!st&&W$.pin==null){try{localStorage.setItem(STORE,JSON.stringify({seed:city.seed,born:city.born,sim:simMin,at:Date.now(),speed:1,paused:false}))}catch(e){}}
  W$.code=cityCode();HB.standalone=W$.code;hbBuzzFetch();hbNewsFetch();
  step('Document: Done',100);
  $('f').addEventListener('load',hook);$('load').hidden=true;$('f').hidden=false;
  show(fromHash(),false);
  addEventListener('popstate',()=>{const c=decodeURIComponent(location.hash.slice(1)).split(/[\/!]/)[0],cur=W$.code+(W$.pin!=null?'~'+W$.pin:'');if(c&&c!==cur&&parseCode(c.split('~')[0])){location.reload();return}show(fromHash(),false)});
  setInterval(animate,80);
}
start();
</script>
</body>
</html>
